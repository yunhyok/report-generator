[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "spd-report-generator"
version = "0.1.2"
description = "Offline Windows power-integrity report generator for SPD and Touchstone files"
requires-python = ">=3.12"
license = "MIT"
dependencies = ["PySide6>=6.7", "numpy>=1.26", "matplotlib>=3.8", "openpyxl>=3.1", "Pillow>=10"]

[project.scripts]
spd-report-generator = "report_generator.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
report_generator = ["docs/*.html", "docs/*.txt", "assets/*.ico"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
